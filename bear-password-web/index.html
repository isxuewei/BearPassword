<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6c5ce7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" href="/app/favicon.png" />
    <title>BearPassword</title>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('bear_password_theme')
          var pref = raw ? JSON.parse(raw) : 'system'
          var resolved =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'midnight'
                : 'earth'
              : pref
          document.documentElement.setAttribute('data-theme', resolved)
          if (resolved === 'dark' || resolved === 'midnight' || resolved === 'noir') {
            document.documentElement.classList.add('dark')
          }
          var fontRaw = localStorage.getItem('bear_password_font')
          var fontPref = fontRaw ? JSON.parse(fontRaw) : 'system'
          document.documentElement.setAttribute('data-font', fontPref === 'system' ? 'system' : 'canger')
          var localeRaw = localStorage.getItem('bear_password_locale')
          var localePref = localeRaw ? JSON.parse(localeRaw) : 'zh-CN'
          var resolvedLocale = localePref
          if (localePref === 'system') {
            var sysLang = (navigator.language || 'zh-CN').toLowerCase()
            resolvedLocale = sysLang.indexOf('ja') === 0 ? 'ja' : sysLang.indexOf('zh') === 0 ? 'zh-CN' : sysLang.indexOf('en') === 0 ? 'en' : 'zh-CN'
          } else if (localePref === 'en-US') {
            resolvedLocale = 'en'
          }
          document.documentElement.lang = resolvedLocale
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
