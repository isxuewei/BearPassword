<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "PingFang SC";
        src: local("PingFang SC");
      }

      @font-face {
        font-family: "Hiragino Sans GB";
        src: local("Hiragino Sans GB");
      }

      @font-face {
        font-family: "Songti SC";
        src: local("Songti SC");
      }

      @font-face {
        font-family: "STSong";
        src: local("STSong");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f5f3fb;
      }
      body {
        font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
        color: #171827;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f5f3fb;
      }

      .scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #f5f3fb;
      }

      .scene:not(:first-child) {
        opacity: 0;
      }

      .scene-content {
        position: relative;
        z-index: 3;
        width: 100%;
        height: 100%;
        padding: 74px 84px 70px;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 54px;
        align-items: center;
        box-sizing: border-box;
      }

      .background-grid {
        position: absolute;
        inset: 0;
        z-index: 0;
        opacity: 0.46;
        background-image:
          linear-gradient(#dfdcef 1px, rgba(245, 243, 251, 0) 1px),
          linear-gradient(90deg, #dfdcef 1px, rgba(245, 243, 251, 0) 1px);
        background-size: 64px 64px;
      }

      .band {
        position: absolute;
        z-index: 1;
        height: 310px;
        width: 2300px;
        left: -150px;
        top: 690px;
        transform: rotate(-7deg);
        background: rgba(124, 108, 246, 0.09);
      }

      .thin-band {
        position: absolute;
        z-index: 1;
        height: 82px;
        width: 2100px;
        left: -80px;
        top: 185px;
        transform: rotate(-7deg);
        background: rgba(191, 242, 229, 0.5);
      }

      .copy-side {
        display: flex;
        flex-direction: column;
        gap: 24px;
        min-width: 0;
      }

      .eyebrow {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        gap: 12px;
        padding: 11px 16px;
        border: 1px solid rgba(124, 108, 246, 0.24);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        color: #6d5df2;
        font-size: 24px;
        font-weight: 700;
        box-shadow: 0 14px 35px rgba(98, 84, 188, 0.12);
      }

      .eyebrow-dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #7c6cf6;
      }

      .scene-title {
        max-width: 690px;
        font-family: "Songti SC", "STSong", serif;
        font-size: 78px;
        line-height: 1.06;
        font-weight: 900;
        letter-spacing: 0;
        color: #171827;
      }

      .caption-panel {
        width: 100%;
        max-width: 710px;
        padding: 30px 32px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.84);
        border: 1px solid rgba(124, 108, 246, 0.16);
        box-shadow: 0 22px 56px rgba(41, 38, 76, 0.14);
      }

      .caption-text {
        font-size: 32px;
        line-height: 1.52;
        font-weight: 560;
        color: #242536;
      }

      .points {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        max-width: 710px;
      }

      .point {
        min-height: 78px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px 16px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.74);
        border: 1px solid rgba(23, 24, 39, 0.08);
        color: #3f4054;
        font-size: 22px;
        font-weight: 700;
        text-align: center;
      }

      .media-side {
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .media-stage {
        position: relative;
        width: 1064px;
        height: 774px;
        transform: rotate(-1.6deg);
      }

      .media-shadow {
        position: absolute;
        inset: 24px 4px -24px 16px;
        border-radius: 8px;
        background: rgba(38, 35, 64, 0.13);
        filter: blur(24px);
        z-index: 0;
      }

      .screenshot-frame {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 8px;
        background: #ffffff;
        border: 1px solid rgba(23, 24, 39, 0.12);
        box-shadow: 0 32px 80px rgba(41, 38, 76, 0.18);
      }

      .screenshot {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }

      .device-label {
        position: absolute;
        right: 22px;
        bottom: 20px;
        z-index: 4;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(23, 24, 39, 0.86);
        color: #ffffff;
        font-size: 19px;
        font-weight: 700;
      }

      .data-strip {
        position: absolute;
        left: -22px;
        top: 72px;
        z-index: 5;
        display: flex;
        gap: 10px;
      }

      .metric {
        width: 128px;
        padding: 13px 12px;
        border-radius: 8px;
        background: #171827;
        color: #ffffff;
        box-shadow: 0 16px 42px rgba(23, 24, 39, 0.18);

      .metric-value {

        font-variant-numeric: tabular-nums;
        font-size: 31px;
        line-height: 1;
        font-weight: 800;

      .metric-label {

        font-size: 14px;
        color: rgba(255, 255, 255, 0.72);

        color: rgba(124, 108, 246, 0.16);
        font-family: "JetBrains Mono", monospace;
        font-size: 120px;
        font-weight: 900;
        letter-spacing: 0;

        right: 84px;
        bottom: 38px;
        z-index: 6;
        height: 8px;
        border-radius: 999px;
        background: rgba(23, 24, 39, 0.08);

        height: 100%;

        border-radius: 999px;

      .scene-number {

        background: #171827;
        color: #ffffff;
        font-family: "JetBrains Mono", monospace;
        font-size: 25px;
        font-weight: 800;
      }
    </style>
  </head>

      const root = document.getElementById("root");
      const totalDuration = scenes.reduce((sum, scene) => sum + scene.duration, 0);

      function createScene(scene, index) {
        const el = document.createElement("section");
        el.id = `scene${index + 1}`;
        el.className = "scene";
        el.style.zIndex = String(index + 1);

        el.innerHTML = `
          <div class="background-grid" data-layout-ignore></div>
          <div class="band" data-layout-ignore></div>
          <div class="thin-band" data-layout-ignore></div>
          <div class="stamp" data-layout-ignore>BP</div>
          <div class="scene-number">${String(index + 1).padStart(2, "0")} / ${String(scenes.length).padStart(2, "0")}</div>
          <div class="scene-content">
            <div class="media-side">
              <div class="media-stage">
                <div class="media-shadow" data-layout-ignore></div>
                <div class="data-strip">
                  <div class="metric"><div class="metric-value">${index + 3}</div><div class="metric-label">账号</div></div>
                  <div class="metric"><div class="metric-value">${(22 - index).toString().padStart(2, "0")}</div><div class="metric-label">秒</div></div>
                </div>
                <div class="screenshot-frame" data-layout-allow-overflow>
                  <img class="screenshot" src="${scene.image}" alt="${scene.label}" />
                </div>
                <div class="device-label">${scene.label}</div>
              </div>
            </div>
            <div class="copy-side">
              <div class="eyebrow"><span class="eyebrow-dot"></span><span>${scene.eyebrow}</span></div>
              <h1 class="scene-title">${scene.title}</h1>
              <div class="caption-panel">
                <p class="caption-text">${scene.text}</p>
              </div>
              ${scene.address ? `<div class="final-address">${scene.address}</div>` : ""}
              <div class="points">
                ${scene.points.map((point) => `<div class="point">${point}</div>`).join("")}
              </div>
            </div>
          </div>
          <div class="progress"><div class="progress-fill"></div></div>
        `;

        root.appendChild(el);
      }

      scenes.forEach(createScene);

      const tl = gsap.timeline({ paused: true });
      const starts = [];
      scenes.reduce((time, scene) => {
        starts.push(time);
        return time + scene.duration;
      }, 0);

      function enterScene(index, at) {
        const selector = `#scene${index + 1}`;
        const base = at + (index === 0 ? 0.25 : 0.68);
        const mediaFrom = index % 3 === 0 ? { x: -52, y: 22, rotation: -3.5 } : index % 3 === 1 ? { y: 54, scale: 0.94 } : { x: 48, y: -18, rotation: 2.8 };

        tl.from(`${selector} .scene-number`, { y: -18, opacity: 0, duration: 0.42, ease: "power2.out" }, base);
        tl.from(`${selector} .media-stage`, { ...mediaFrom, opacity: 0, duration: 0.72, ease: "back.out(1.35)" }, base + 0.04);
        tl.from(`${selector} .data-strip`, { x: -35, opacity: 0, duration: 0.46, ease: "power3.out" }, base + 0.28);
        tl.from(`${selector} .eyebrow`, { x: 28, opacity: 0, duration: 0.44, ease: "sine.out" }, base + 0.18);
        tl.from(`${selector} .scene-title`, { y: 34, opacity: 0, duration: 0.58, ease: "expo.out" }, base + 0.34);
        tl.from(`${selector} .caption-panel`, { y: 30, scale: 0.985, opacity: 0, duration: 0.55, ease: "power2.out" }, base + 0.58);
        const sceneEl = document.getElementById(`scene${index + 1}`);
        const finalAddress = sceneEl.querySelector(".final-address");
        if (finalAddress) {
          tl.from(finalAddress, { y: 18, opacity: 0, duration: 0.42, ease: "power4.out" }, base + 0.74);
        }
        tl.from(`${selector} .point`, { y: 24, opacity: 0, duration: 0.42, stagger: 0.08, ease: "power3.out" }, base + 0.82);
        tl.from(`${selector} .progress-fill`, { scaleX: 0, transformOrigin: "left center", duration: scenes[index].duration - 0.75, ease: "none" }, at + 0.35);
        tl.to(`${selector} .screenshot`, { y: index % 2 === 0 ? -12 : 10, duration: 3.1, repeat: Math.floor(scenes[index].duration / 3.1) - 1, yoyo: true, ease: "sine.inOut" }, base + 1.0);
      }

      function blurTransition(previous, next, at) {
        tl.to(`#scene${previous + 1}`, { filter: "blur(12px)", scale: 1.025, opacity: 0, duration: 0.56, ease: "power2.inOut" }, at);
        tl.fromTo(`#scene${next + 1}`, { filter: "blur(12px)", scale: 0.985, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.56, ease: "power2.inOut" }, at + 0.08);
      }

      function pushTransition(previous, next, at) {
        tl.to(`#scene${previous + 1}`, { x: -1920, duration: 0.52, ease: "power3.inOut" }, at);
        tl.fromTo(`#scene${next + 1}`, { x: 1920, opacity: 1 }, { x: 0, duration: 0.52, ease: "power3.inOut" }, at);
        tl.set(`#scene${previous + 1}`, { opacity: 0 }, at + 0.53);
      }

      scenes.forEach((_, index) => {
        if (index > 0) {
          const transitionAt = starts[index];
          if ([3, 6, 8, 11, 14].includes(index)) {
            pushTransition(index - 1, index, transitionAt);
          } else {
            blurTransition(index - 1, index, transitionAt);
          }
        }
        enterScene(index, starts[index]);
      });

      tl.to("#scene15 .scene-content, #scene15 .stamp", { y: -24, opacity: 0, duration: 0.85, ease: "power2.in" }, totalDuration - 1.05);
      tl.to("#scene15", { backgroundColor: "#171827", duration: 0.85, ease: "sine.inOut" }, totalDuration - 1.05);

      window.__timelines["main"] = tl;
