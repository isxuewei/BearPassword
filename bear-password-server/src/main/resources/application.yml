spring:
  application:
    name: bear-password-server
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      db-type: mysql
      initial-size: 5
      min-idle: 5
      max-active: 20
      connection-init-sqls: SET time_zone = '+08:00'
      max-wait: 60000
      keep-alive: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1
      validation-query-timeout: 3
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      remove-abandoned: true
      remove-abandoned-timeout: 1800
      log-abandoned: true
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 5000
          merge-sql: true
        wall:
          enabled: true
          config:
            multi-statement-allow: true
        slf4j:
          enabled: true
          statement-log-enabled: false
          result-set-log-enabled: false
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: false
        url-pattern: /druid/*
        reset-enable: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8080
  servlet:
    context-path: /api

# Sa-Token 配置
sa-token:
  # token 名称，对应请求头 Authorization
  token-name: Authorization
  # 允许从请求头读取 token
  is-read-header: true
  # 不从 Cookie 读取（桌面端使用 Header 传递）
  is-read-cookie: false
  # Bearer 前缀，最终格式：Authorization: Bearer xxx
  token-prefix: Bearer
  # token 有效期（秒），默认 7 天
  timeout: 604800
  # 临时有效期（-1 表示不限制）
  active-timeout: -1
  # 是否允许同一账号多地登录
  is-concurrent: true
  # 多人登录是否共用同一 token
  is-share: false
  # token 风格（uuid / simple-uuid / random-32 等）
  token-style: uuid
  # 是否输出操作日志
  is-log: true

# MyBatis Plus 全局配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志
logging:
  level:
    com.bear.password: debug
    com.bear.password.module: debug
    com.alibaba.druid.pool: info

# 注册验证码
bear:
  password:
    mail:
      from-name: BearPassword
    register:
      code-expire-minutes: 5
      send-interval-seconds: 60
    redis:
      key-prefix: bear:password
    mfa:
      totp-encryption-key: ${MFA_TOTP_ENCRYPTION_KEY:}
      session-ttl-seconds: 300