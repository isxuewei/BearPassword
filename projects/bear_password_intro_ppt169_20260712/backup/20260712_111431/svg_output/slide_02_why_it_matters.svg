<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>Why BearPassword Matters</title>
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFF8ED"/>
    <circle cx="1135" cy="92" r="180" fill="#FEF3C7" opacity="0.55"/>
    <circle cx="82" cy="630" r="170" fill="#DBEAFE" opacity="0.34"/>
  </g>
  <g id="header">
    <text x="64" y="78" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="42" font-weight="800" fill="#7A4B22">账号越多，真正难的是“安心管理”</text>
    <text x="66" y="120" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#1F2937">BearPassword 聚焦的不只是保存密码，而是把登录、验证码和敏感信息管理变成可控流程。</text>
  </g>
  <g id="pain-card-1">
    <rect x="64" y="178" width="330" height="162" rx="26" fill="#FFFFFF" stroke="#E8D9C5" stroke-width="1.8"/>
    <circle cx="112" cy="226" r="28" fill="#FEF3C7"/>
    <path d="M101 226 L123 226 M112 215 L112 237" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <text x="154" y="218" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="800" fill="#1F2937">账号分散</text>
    <text x="154" y="260" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">多网站、多账号，</text>
    <text x="154" y="294" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">复制粘贴容易出错。</text>
  </g>
  <g id="pain-card-2">
    <rect x="64" y="364" width="330" height="162" rx="26" fill="#FFFFFF" stroke="#E8D9C5" stroke-width="1.8"/>
    <circle cx="112" cy="412" r="28" fill="#DBEAFE"/>
    <path d="M112 396 A16 16 0 1 1 111 396 M112 404 L112 414 L120 420" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <text x="154" y="404" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="800" fill="#1F2937">验证码割裂</text>
    <text x="154" y="446" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">TOTP 需要实时查看，</text>
    <text x="154" y="480" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">和登录流程常常断开。</text>
  </g>
  <g id="pain-card-3">
    <rect x="426" y="178" width="330" height="348" rx="26" fill="#FFFFFF" stroke="#E8D9C5" stroke-width="1.8"/>
    <circle cx="484" cy="232" r="34" fill="#DCFCE7"/>
    <path d="M470 230 L484 216 L498 230 L498 250 L470 250 Z" fill="none" stroke="#16A34A" stroke-width="3" stroke-linejoin="round"/>
    <text x="532" y="226" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="800" fill="#1F2937">敏感信息不止密码</text>
    <text x="466" y="304" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">银行卡、证件、服务器、</text>
    <text x="466" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">数据库、安全备注……</text>
    <rect x="466" y="388" width="226" height="50" rx="25" fill="#FFF8ED" stroke="#E8D9C5"/>
    <text x="494" y="421" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#7A4B22">不适合散落在普通笔记</text>
  </g>
  <g id="answer-card">
    <rect x="800" y="178" width="416" height="348" rx="32" fill="#7A4B22"/>
    <circle cx="1122" cy="266" r="118" fill="#F59E0B" opacity="0.18"/>
    <text x="844" y="240" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">BearPassword 的答案</text>
    <text x="844" y="302" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#FEF3C7">一个保险库，两个使用场景</text>
    <text x="844" y="364" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#FFFFFF">桌面端集中管理各类敏感信息，</text>
    <text x="844" y="402" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#FFFFFF">浏览器扩展在网页登录时安全取用。</text>
    <rect x="844" y="452" width="238" height="48" rx="24" fill="#FFFFFF" opacity="0.16"/>
    <text x="870" y="484" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">从保存到填充的闭环</text>
  </g>
  <g id="footer">
    <text x="64" y="654" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#6B7280">Source: BearPassword README</text>
    <text x="1140" y="654" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#6B7280">02 / 08</text>
  </g>
</svg>
