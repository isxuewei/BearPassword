<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>Technology and Deployment</title>
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFF8ED"/>
    <circle cx="140" cy="125" r="180" fill="#FEF3C7" opacity="0.45"/>
    <circle cx="1130" cy="620" r="190" fill="#DBEAFE" opacity="0.38"/>
  </g>
  <g id="header">
    <text x="64" y="78" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="42" font-weight="800" fill="#7A4B22">对普通用户开箱即用，对开发者可自建</text>
    <text x="66" y="120" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#1F2937">BearPassword 同时提供端侧体验、浏览器集成和可自建服务端的完整工程实现。</text>
  </g>
  <g id="tech-column-desktop">
    <rect x="64" y="164" width="356" height="286" rx="28" fill="#FFFFFF" stroke="#E8D9C5" stroke-width="2"/>
    <circle cx="112" cy="218" r="30" fill="#FEF3C7"/>
    <rect x="98" y="204" width="28" height="22" rx="4" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="158" y="226" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="800" fill="#1F2937">桌面端</text>
    <text x="104" y="292" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">Electron · Vue 3</text>
    <text x="104" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">TypeScript · Pinia</text>
    <text x="104" y="368" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">Element Plus · Vite</text>
    <rect x="104" y="396" width="166" height="34" rx="17" fill="#FFF8ED"/>
    <text x="124" y="419" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="800" fill="#7A4B22">管理保险库</text>
  </g>
  <g id="tech-column-extension">
    <rect x="462" y="164" width="356" height="286" rx="28" fill="#FFFFFF" stroke="#E8D9C5" stroke-width="2"/>
    <circle cx="510" cy="218" r="30" fill="#DBEAFE"/>
    <path d="M496 208 L524 208 L524 228 L496 228 Z M500 216 L520 216" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
    <text x="556" y="226" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="800" fill="#1F2937">浏览器扩展</text>
    <text x="502" y="292" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">Manifest V3 · Vue 3</text>
    <text x="502" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">TypeScript · Vite</text>
    <text x="502" y="368" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">CRXJS</text>
    <rect x="502" y="396" width="166" height="34" rx="17" fill="#DBEAFE"/>
    <text x="522" y="419" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="800" fill="#2563EB">网页即用</text>
  </g>
  <g id="tech-column-server">
    <rect x="860" y="164" width="356" height="286" rx="28" fill="#FFFFFF" stroke="#E8D9C5" stroke-width="2"/>
    <circle cx="908" cy="218" r="30" fill="#DCFCE7"/>
    <path d="M892 222 C896 210 908 202 922 210 C934 212 936 228 924 234 L898 234 C886 232 884 222 892 222 Z" fill="none" stroke="#16A34A" stroke-width="2.5"/>
    <text x="954" y="226" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="800" fill="#1F2937">服务端</text>
    <text x="900" y="292" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">Java 17 · Spring Boot 3</text>
    <text x="900" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">MyBatis Plus · MySQL</text>
    <text x="900" y="368" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#6B7280">Druid</text>
    <rect x="900" y="396" width="190" height="34" rx="17" fill="#DCFCE7"/>
    <text x="920" y="419" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="800" fill="#166534">账号与密文同步</text>
  </g>
  <g id="deployment-bar">
    <rect x="64" y="492" width="1152" height="94" rx="30" fill="#7A4B22"/>
    <text x="104" y="548" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">使用路径</text>
    <text x="266" y="548" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#FEF3C7">普通用户从官网下载；开发者可按 README 本地运行或自建服务端。</text>
  </g>
  <g id="footer">
    <text x="64" y="654" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#6B7280">项目组成：desktop · extension · server · index</text>
    <text x="1140" y="654" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#6B7280">07 / 08</text>
  </g>
</svg>
