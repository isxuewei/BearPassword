<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>Security Model</title>
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFF8ED"/>
    <rect x="36" y="42" width="1208" height="636" rx="40" fill="#FFFFFF" opacity="0.55"/>
  </g>
  <g id="header">
    <text x="64" y="78" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="42" font-weight="800" fill="#7A4B22">安全设计：主密码不明文上传，服务器只存密文</text>
    <text x="66" y="120" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#1F2937">安全边界建立在客户端加密、本机通信和自动锁定等机制上。</text>
  </g>
  <g id="security-stack">
    <rect x="76" y="172" width="520" height="84" rx="24" fill="#7A4B22"/>
    <text x="114" y="224" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">1. 设备侧加密</text>
    <text x="356" y="224" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#FEF3C7">保险库内容本地加密后再同步</text>

    <rect x="116" y="272" width="520" height="84" rx="24" fill="#FFFFFF" stroke="#E8D9C5" stroke-width="2"/>
    <text x="154" y="324" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="800" fill="#1F2937">2. 主密码保护</text>
    <text x="396" y="324" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#6B7280">不会明文上传到服务器</text>

    <rect x="156" y="372" width="520" height="84" rx="24" fill="#DBEAFE" stroke="#BBD5FF" stroke-width="2"/>
    <text x="194" y="424" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="800" fill="#1F2937">3. 本机桥接</text>
    <text x="396" y="424" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#2563EB">扩展向已解锁桌面端取用</text>

    <rect x="196" y="472" width="520" height="84" rx="24" fill="#DCFCE7" stroke="#BEE7C8" stroke-width="2"/>
    <text x="234" y="524" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="800" fill="#1F2937">4. 使用保护</text>
    <text x="436" y="524" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#166534">自动锁定、剪贴板清空、生物解锁</text>
  </g>
  <g id="screenshots">
    <rect x="778" y="156" width="382" height="278" rx="30" fill="#D6B98D" opacity="0.20"/>
    <rect x="760" y="140" width="382" height="278" rx="30" fill="#FFFFFF" stroke="#E8D9C5" stroke-width="2"/>
    <image href="../images/security-settings.png" x="782" y="162" width="338" height="206" preserveAspectRatio="xMidYMid meet"/>
    <rect x="794" y="386" width="170" height="36" rx="18" fill="#FEF3C7"/>
    <text x="816" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="800" fill="#7A4B22">安全设置</text>

    <rect x="860" y="452" width="300" height="154" rx="28" fill="#FFFFFF" stroke="#E8D9C5" stroke-width="2"/>
    <image href="../images/biometric.png" x="882" y="470" width="126" height="92" preserveAspectRatio="xMidYMid meet"/>
    <text x="1032" y="510" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="800" fill="#1F2937">可选生物识别</text>
    <text x="1032" y="546" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#6B7280">提升本机解锁体验</text>
  </g>
  <g id="footer">
    <text x="64" y="654" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#6B7280">安全事实来自 README：客户端加密、主密码保护、本机通信、自动锁定</text>
    <text x="1140" y="654" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#6B7280">06 / 08</text>
  </g>
</svg>
