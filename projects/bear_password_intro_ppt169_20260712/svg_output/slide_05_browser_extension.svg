<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>Browser Extension</title>
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFF8ED"/>
    <circle cx="1180" cy="110" r="190" fill="#DBEAFE" opacity="0.48"/>
  </g>
  <g id="header">
    <text x="64" y="78" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="42" font-weight="800" fill="#7A4B22">浏览器扩展：在网页登录时一键填充</text>
    <text x="66" y="120" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#1F2937">扩展让保险库能力进入登录现场，同时保持数据由本机桌面端解锁和提供。</text>
  </g>
  <g id="autofill-screenshot">
    <rect x="64" y="160" width="680" height="424" rx="32" fill="#D6B98D" opacity="0.2"/>
    <rect x="48" y="144" width="680" height="424" rx="32" fill="#FFFFFF" stroke="#E8D9C5" stroke-width="2"/>
    <image href="../images/autofill.png" x="76" y="170" width="624" height="340" preserveAspectRatio="xMidYMid meet"/>
    <rect x="92" y="526" width="240" height="42" rx="21" fill="#DBEAFE"/>
    <text x="118" y="554" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="800" fill="#2563EB">网页填充层</text>
  </g>
  <g id="extension-popup-panel">
    <rect x="782" y="150" width="182" height="284" rx="30" fill="#FFFFFF" stroke="#E8D9C5" stroke-width="2"/>
    <image href="../images/extension-popup.png" x="804" y="174" width="138" height="206" preserveAspectRatio="xMidYMid meet"/>
    <text x="820" y="414" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="800" fill="#7A4B22">扩展弹窗</text>
  </g>
  <g id="feature-chips">
    <rect x="1002" y="148" width="214" height="82" rx="22" fill="#FFFFFF" stroke="#E8D9C5" stroke-width="1.6"/>
    <text x="1026" y="184" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#1F2937">智能匹配</text>
    <text x="1026" y="214" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#6B7280">按当前网站列出条目</text>

    <rect x="1002" y="250" width="214" height="82" rx="22" fill="#FFFFFF" stroke="#E8D9C5" stroke-width="1.6"/>
    <text x="1026" y="286" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#1F2937">一键填充</text>
    <text x="1026" y="316" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#6B7280">点选条目填账号密码</text>

    <rect x="1002" y="352" width="214" height="82" rx="22" fill="#FFFFFF" stroke="#E8D9C5" stroke-width="1.6"/>
    <text x="1026" y="388" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#1F2937">TOTP 顺手</text>
    <text x="1026" y="418" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#6B7280">填充时可自动复制</text>

    <rect x="782" y="466" width="434" height="118" rx="26" fill="#2563EB"/>
    <text x="820" y="514" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">浏览器里不再重复输入主密码</text>
    <text x="820" y="554" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#DBEAFE">扩展通过本机安全通道向已解锁桌面端请求数据。</text>
  </g>
  <g id="footer">
    <text x="64" y="654" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#6B7280">扩展能力：匹配 · 填充 · 复制 TOTP · 快捷保存</text>
    <text x="1140" y="654" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#6B7280">05 / 08</text>
  </g>
</svg>
